<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과목에서 찾은 진로</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 100px auto;
      padding: 20px;
      line-height: 1.8;
    }
    h1 { color: #333; }
    p { color: #666; }
  </style>
</head>
<body>
  <h1>과목에서 찾은 진로</h1>
  <h2>Course to Career</h2>

  <p>
    내가 경험한 수업에서 시작하는 진로 탐색 서비스
  </p>

  <h3>프로젝트 소개</h3>
  <p>
    대학생이 수강했던 과목과 선호 활동을 바탕으로
    적합한 직업과 다음 학기 수강 과목을 추천하는
    대학원 연구 프로젝트입니다.
  </p>

  <h3>주요 기능</h3>
  <ul>
    <li>수강 과목 선택</li>
    <li>선호 및 비선호 활동 분석</li>
    <li>활동 기반 직업 추천</li>
    <li>다음 학기 수강 과목 추천</li>
  </ul>

  <h3>개발 현황</h3>
  <p>현재 연구 및 프로토타입 개발 중입니다.</p>
</body>
</html>
